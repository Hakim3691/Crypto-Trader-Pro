name: Build APK

# Builds debug / release / both APKs for the ProactiveMS Android app.
#
# The repository intentionally does not commit a few things this build needs,
# so the workflow provisions them on the runner:
#   - gradlew + gradle-wrapper.jar are absent      -> regenerated with the
#     Gradle distribution installed by gradle/actions/setup-gradle.
#   - .env (Secrets Gradle Plugin)                 -> copied from .env.example
#     or created empty.
#   - debug.keystore / my-upload-key.jks are gitignored -> decoded from
#     *.base64 when available, otherwise generated with keytool.
#
# Signing secrets (KEYSTORE_PATH / STORE_PASSWORD / KEY_PASSWORD) are resolved
# inside bash instead of a step-level env: block, because unconfigured
# repository secrets arrive as empty strings and would make Gradle throw
# "Cannot convert '' to File" when evaluating file(System.getenv(...)).

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to assemble'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      run_tests:
        description: 'Run unit and Robolectric tests before building'
        required: false
        default: true
        type: boolean

  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A newer run for the same ref (push or manual dispatch) cancels the older one.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build type
        id: resolve
        env:
          # Empty string on push events; ${RAW_TYPE:-debug} below guarantees a
          # non-empty value for both push and workflow_dispatch.
          RAW_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -euo pipefail

          BUILD_TYPE="${RAW_TYPE:-debug}"
          case "$BUILD_TYPE" in
            debug|release|both) ;;
            *)
              echo "::error::Unsupported build_type '${BUILD_TYPE}' (expected debug, release, or both)."
              exit 1
              ;;
          esac

          # Exported for the later test/build steps and the artifact name.
          echo "BUILD_TYPE=${BUILD_TYPE}" >> "$GITHUB_ENV"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"
          echo "Resolved build type: ${BUILD_TYPE}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Keep in sync with gradle/wrapper/gradle-wrapper.properties. This
          # also puts `gradle` on PATH, which is how the missing gradlew script
          # gets regenerated in the provisioning step below.
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail

          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::warning::Android SDK not found on runner; skipping license acceptance."
            exit 0
          fi
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          LICENSE_DIR="$ANDROID_HOME/licenses"
          mkdir -p "$LICENSE_DIR"

          # Official Google SDK license hashes. Append-only so a pre-accepted
          # licenses/ directory on the runner is never clobbered with an
          # invalid value.
          accept_license () {
            local file="$LICENSE_DIR/$1" hash="$2"
            touch "$file"
            grep -qxF "$hash" "$file" || printf '%s\n' "$hash" >> "$file"
          }

          accept_license android-sdk-license 8933bad161af4178b1185d1a37fbf41ea5269c55
          accept_license android-sdk-license d56f5187479451eabf01fb78af6dfcb131a6481e
          accept_license android-sdk-license 24333f8a63b6825ea9c5514f83c2829b004d1fee
          accept_license android-sdk-preview-license 84831b9409646a918e30573bab4c9c91346d8abd

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Running: yes | sdkmanager --licenses"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          else
            echo "::notice::sdkmanager not found on PATH; license files were written directly."
          fi

      - name: Provision .env, gradlew and signing keystores
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # ---- .env, required by the Secrets Gradle Plugin -----------------
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              : > .env
            fi
            echo "Created .env (required by the Secrets Gradle Plugin)."
          fi

          # ---- Gradle wrapper -----------------------------------------------
          # This repository does not commit gradlew / gradle-wrapper.jar, so
          # regenerate them with the Gradle distribution installed above.
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            if ! command -v gradle >/dev/null 2>&1; then
              echo "::error::gradlew is missing and no 'gradle' CLI is available to regenerate it."
              exit 1
            fi
            WRAPPER_VERSION="$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-.*$/\1/p' gradle/wrapper/gradle-wrapper.properties | head -n 1)"
            echo "gradlew or gradle-wrapper.jar is missing; regenerating the Gradle wrapper (version: ${WRAPPER_VERSION:-installed})."
            # --no-configuration-cache keeps this one-off task immune to any
            # configuration-cache incompatibilities.
            if [ -n "$WRAPPER_VERSION" ]; then
              gradle --no-configuration-cache wrapper --gradle-version "$WRAPPER_VERSION"
            else
              gradle --no-configuration-cache wrapper
            fi
          fi
          chmod +x gradlew
          ./gradlew --version

          # ---- Debug keystore (gitignored) -----------------------------------
          if [ -s debug.keystore.base64 ]; then
            if ! base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null; then
              rm -f debug.keystore
              echo "::warning::Could not decode debug.keystore.base64; generating a fresh debug keystore."
            fi
          fi

          # A decoded keystore that keytool cannot open is useless anyway (the
          # build hardcodes the "android" debug store password), so regenerate.
          if [ -s debug.keystore ] && ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            echo "::warning::debug.keystore is not a valid keystore; regenerating."
          fi

          if [ ! -s debug.keystore ]; then
            echo "::group::Generating debug keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
            echo "::endgroup::"
          fi

          # ---- Release keystore (gitignored) ----------------------------------
          # app/build.gradle.kts expects my-upload-key.jks with alias "upload".
          if [ ! -s my-upload-key.jks ]; then
            echo "::group::Generating release upload keystore"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=AI Phone, OU=Engineering, O=AI Phone, L=Mountain View, ST=CA, C=US"
            echo "::endgroup::"
          fi

          # ---- Signing secrets: sanitize before they reach Gradle -------------
          # Unset repository secrets expand to "" and would make Gradle fail
          # with "Cannot convert '' to File", so fall back to sane defaults.
          SECRET_KEYSTORE="${{ secrets.KEYSTORE_PATH }}"
          if [ -n "$SECRET_KEYSTORE" ] && [ -f "$SECRET_KEYSTORE" ]; then
            export KEYSTORE_PATH="$SECRET_KEYSTORE"
          else
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
          fi

          SECRET_STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          export STORE_PASSWORD="${SECRET_STORE_PASS:-android}"

          SECRET_KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          export KEY_PASSWORD="${SECRET_KEY_PASS:-android}"

          # Hand the resolved values to the later test/build steps. Password
          # values are never printed to the log.
          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "::group::Signing configuration"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH"
          echo "Debug keystore present:   $([ -s debug.keystore ] && echo yes || echo no)"
          echo "Release keystore present: $([ -s my-upload-key.jks ] && echo yes || echo no)"
          echo "::endgroup::"

      - name: Ensure Gradle memory settings
        run: |
          set -euo pipefail

          GRADLE_PROPERTIES=gradle.properties
          [ -f "$GRADLE_PROPERTIES" ] || touch "$GRADLE_PROPERTIES"

          ensure_property () {
            local key="$1" value="$2"
            if grep -qE "^${key}=" "$GRADLE_PROPERTIES"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$GRADLE_PROPERTIES"
            else
              printf '%s\n' "${key}=${value}" >> "$GRADLE_PROPERTIES"
            fi
          }

          # Prevents out-of-memory failures on GitHub's 7 GB runners.
          ensure_property org.gradle.jvmargs '-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC'
          ensure_property org.gradle.parallel true
          ensure_property org.gradle.configuration-cache true

          echo "::group::gradle.properties"
          cat "$GRADLE_PROPERTIES"
          echo "::endgroup::"

      - name: Run unit and Robolectric tests
        # github.event.inputs values are always strings, so compare against the
        # string 'false'. ('false' != false would always be true and would
        # never skip the tests.) On push events the input is null and tests run.
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests != 'false' }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --continue

      - name: Build APK
        run: |
          set -euo pipefail

          case "$BUILD_TYPE" in
            debug)   TASKS=":app:assembleDebug" ;;
            release) TASKS=":app:assembleRelease" ;;
            both)    TASKS=":app:assembleDebug :app:assembleRelease" ;;
            *)
              echo "::error::Unsupported BUILD_TYPE '${BUILD_TYPE}'."
              exit 1
              ;;
          esac

          echo "Running: ./gradlew ${TASKS} --stacktrace"
          # Intentional word splitting: TASKS holds one or two Gradle tasks.
          # shellcheck disable=SC2086
          ./gradlew $TASKS --stacktrace

      - name: List generated APKs
        if: always()
        run: |
          set -euo pipefail
          if [ -d app/build/outputs/apk ]; then
            echo "::group::Generated APKs"
            find app/build/outputs/apk -type f -name "*.apk" | sort
            echo "::endgroup::"
          else
            echo "::warning::app/build/outputs/apk does not exist; no APKs were produced."
          fi

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProactiveMS-${{ steps.resolve.outputs.build_type }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
